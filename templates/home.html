<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #263238;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .close {
            position: absolute;
            color: #fff;
            top: 20px;
            right: 50px;
            font-size: 1.7em;
            cursor: pointer;
            display: none;
            z-index: 999;
            transform: rotate(0deg);
            transition: all 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .close:hover {
            font-size: 2.4em;
            transform: rotate(360deg);
        }
        .search {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 1000px;
            width: 0;
            height: 0;
            background: #03a9f4;
            transition: all .4s linear;
        }
        .search i {
            color: #03a9f4;
            font-size: 1.7em;
            cursor: pointer;
        }
        .search .input {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            border-bottom: 3px solid #eee;
            color: #eee;
            font-size: 1.3em;
            display: none;
        }
        .search.open {
            height: 4000px;
            width: 4000px;
        }
        .navigate-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #03a9f4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .navigate-button:hover {
            background-color: #0288d1;
        }
    </style>
</head>
<body>
    <div class="close">
        <i class="fa fa-close"></i>
    </div>
    <div class="search">
        <i class="fa fa-search"></i>
        <input type="text" class="input">
    </div>
    <button class="navigate-button" onclick="window.location.href='form.html'">Go to Form</button>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        (function ($) {
            var search_button = $('.fa-search'),
                close_button = $('.close'),
                input = $('.input');
            search_button.on('click', function () {
                $(this).parent().addClass('open');
                close_button.fadeIn(500);
                input.fadeIn(500);
            });
            close_button.on('click', function () {
                search_button.parent().removeClass('open');
                close_button.fadeOut(500);
                input.fadeOut(500);
            });
        })(jQuery);
    </script>
</body>
</html>
